<text x="80" y="80" fill="#1e40af" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="30" text-anchor="start" font-weight="500"><tspan x="80" dy="0">Ajustes: solicitação até a apuração</tspan></text>
<text x="80" y="113" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" text-anchor="start" font-weight="500"><tspan x="80" dy="0">O registro original permanece auditável; a mudança só afeta a apuração depois da decisão permitida.</tspan></text></svg>